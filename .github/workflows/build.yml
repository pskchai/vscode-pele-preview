name: Build Pele Preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm test:renderers
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: xvfb-run -a pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: pele-preview-vsix
          path: '*.vsix'
